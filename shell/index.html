<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Books Example Site</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
</head>
<body>
  <div class="container">
    <div class="row" style="margin-top: 15px">
      <button onclick="document.getElementById('iframe').src='home.html';"
         class="two columns button-primary">Home</button>
      <button
         onclick="document.getElementById('iframe').src='https://tarea3-sisdis-books-isaiasv.netlify.app';"
             class="two columns button-primary">Books</button>
      <button
         onclick="document.getElementById('iframe').src='https://tarea3-sisdis-authors-isaiasv.netlify.app';"
         class="two columns button-primary">Authors</button>
      <button
         onclick="document.getElementById('iframe').src='https://tarea3-sisdis-publishers-isaiasv.netlify.app';"
         class="two columns button-primary">Publishers</button>
      <button
         onclick="document.getElementById('iframe').src='https://tarea3-sisdis-reviews-isaiasv.netlify.app';"
         class="two columns button-primary">Reviews</button>
    </div>
    <div class="row" style="height: 500px">
      <div class="twelve columns" style="height: 100%">
        <iframe id="iframe" style="border:0px solid black;"
                src="home.html" width="100%" height="100%"></iframe>
      </div>
    </div>
    <div class="row" style="margin-top: 15px">
       <button disabled="disabled" class="twelve columns button-primary">
          Copyright (c) 2026 - Isaías Víquez</button>
    </div>
  </div>
</body>
</html>
